<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96" role="img" aria-label="MyLumi">
  <title>MyLumi</title>
  <!-- README lockup: the Lumi mark plus the wordmark. Hex is hardcoded because
       GitHub strips CSS custom properties; keep in step with tokens.css. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#D6249F"/>
    </linearGradient>
    <radialGradient id="magma" cx="0.5" cy="0.94" r="0.8">
      <stop offset="0" stop-color="#FFB265" stop-opacity="0.92"/>
      <stop offset="0.35" stop-color="#F0479A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D6249F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F5679A" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#B0309F" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#D6249F"/>
    </linearGradient>
  </defs>

  <g transform="translate(4,2) scale(0.9)">
    <circle cx="50" cy="54" r="48" fill="url(#halo)"/>
    <path id="p" d="M28,84 L33,84 C31.5,88.5 32.5,93 38,93 C43.5,93 44.5,88.5 43,84 L52,84 C51,87.5 52,90.5 55.5,90.5 C59,90.5 59.5,87.5 58.5,84 L66,84 C78,84 88,74 88,56 C88,32 76,14 56,14 C36,14 14,30 14,52 C14,70 18,84 28,84 Z" fill="url(#body)"/>
    <use href="#p" fill="url(#magma)"/>
    <circle cx="38" cy="96.5" r="2.2" fill="#F79A5C"/>
    <g transform="translate(50,50)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
      <path d="M-10,-5.6 Q-6,0.6 -2,-5.6"/>
      <path d="M2,-5.6 Q6,0.6 10,-5.6"/>
      <path d="M-5,5.6 Q0,10 5,5.6"/>
    </g>
  </g>

  <text x="108" y="64"
        font-family="'League Spartan', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1" fill="url(#text)">MyLumi</text>
</svg>
