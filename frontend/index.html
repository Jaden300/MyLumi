<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MyLumi - sleep-linked symptom and mood journaling for concussion recovery."
    />
    <link rel="icon" type="image/svg+xml" href="/lumi-mark.svg" />
    <link rel="apple-touch-icon" href="/lumi-mark.svg" />
    <!-- Matches the dark theme's --bg so the browser chrome does not flash white. -->
    <meta name="theme-color" content="#140a2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="MyLumi" />
    <meta
      property="og:description"
      content="Sleep-linked symptom and mood journaling for concussion recovery. Your data stays on your device."
    />
    <meta property="og:image" content="/lumi-mark.svg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>MyLumi</title>
    <script>
      // Apply stored theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem("mylumi.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* storage unavailable - fall back to system preference */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
